spring:
  application:
    name: novabank

  # H2 by default so the API runs with `./mvnw spring-boot:run` and nothing else installed.
  # The `postgres` profile (used by Docker Compose) swaps in PostgreSQL - see below.
  datasource:
    url: jdbc:h2:mem:novabank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: novabank-pool
      # A money-movement request can hold two connections at once: the outer transaction plus the
      # REQUIRES_NEW audit write nested inside it. The pool must therefore be comfortably larger
      # than the expected concurrent write count, or requests holding row locks end up queuing for
      # a connection that only a lock-holder can release.
      maximum-pool-size: 24
      minimum-idle: 4
      connection-timeout: 20000
      leak-detection-threshold: 20000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # `validate`, never `update`: Flyway owns the schema. Hibernate's job is to fail fast at
    # startup if an entity and the migrated schema have drifted apart, not to silently ALTER
    # a production table.
    hibernate:
      ddl-auto: validate
    open-in-view: false          # avoid lazy loading in the view layer; DTOs are mapped in services
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 strings, which JavaScript's Date parses directly

  threads:
    virtual:
      enabled: true                       # Java 21 virtual threads for request handling

server:
  port: 8080
  error:
    include-stacktrace: never             # never leak internals to a client
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.gurudutta.bank: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# -------------------------------------------------------------------------------------
# Application settings. Every value can be overridden by an environment variable, which is
# what lets the same jar run in dev, docker and prod without a rebuild.
# -------------------------------------------------------------------------------------
app:
  jwt:
    # DEV DEFAULT ONLY. In any real deployment this comes from the environment / a secret
    # manager, and the app refuses to start if it is shorter than 32 characters.
    secret: ${JWT_SECRET:novabank-development-signing-key-change-me-in-production-2026}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    issuer: novabank
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  limits:
    min-opening-balance: 500.00
    max-transaction-amount: 500000.00
    default-daily-transfer-limit: 100000.00
    savings-minimum-balance: 500.00
    current-overdraft-limit: 10000.00
  seed:
    enabled: ${SEED_DEMO_DATA:true}

---
# =====================================================================================
# PostgreSQL profile - activated by Docker Compose via SPRING_PROFILES_ACTIVE=postgres
# =====================================================================================
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novabank}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:novabank}
    password: ${DB_PASSWORD:novabank}
    hikari:
      maximum-pool-size: 24
      minimum-idle: 6

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
