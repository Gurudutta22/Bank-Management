server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to anyone probing the server.
    server_tokens off;

    # ---------------------------------------------------------------- security headers
    add_header X-Frame-Options            "DENY"            always;  # no clickjacking via iframe
    add_header X-Content-Type-Options     "nosniff"         always;  # no MIME sniffing
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------- API proxying
    # The browser only ever talks to this origin, so /api is same-origin and CORS never
    # applies in production. The backend hostname is the Compose service name.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Preserves the client IP so audit-log entries record the real caller, not the proxy.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /swagger-ui/   { proxy_pass http://backend:8080/swagger-ui/; }
    location /v3/api-docs   { proxy_pass http://backend:8080/v3/api-docs; }
    location /actuator/     { proxy_pass http://backend:8080/actuator/; }

    # ------------------------------------------------------------------------ caching
    # Vite fingerprints asset filenames (index-a1b2c3.js), so those can be cached forever:
    # a new build produces a new name. index.html must never be cached, or browsers would
    # keep loading the old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ------------------------------------------------------------------ SPA fallback
    # React Router owns the routes. Without this, refreshing on /dashboard would ask nginx
    # for a file called "dashboard" and return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
